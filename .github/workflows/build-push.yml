name: FE CI/CD

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      branch:
        description: '배포할 브랜치 (main / develop)'
        required: false
        default: 'main'

env:
  AWS_REGION:     ${{ secrets.AWS_REGION }}
  ECR_REGISTRY:   ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ECR_REPO:       ${{ secrets.ECR_FE_REPO }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. 소스 체크아웃 ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Docker Buildx ─────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. AWS 자격증명 ──────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 4. ECR 로그인 ────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 5. 이미지 빌드 & 푸시 ───────────────────────────────────────────
      - name: Build and push image
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}
          SHA=${{ github.sha }}

          docker build \
            --build-arg NEXT_PUBLIC_API_BASE=https://matuabom.store \
            --no-cache \
            -t $IMAGE:$SHA \
            -t $IMAGE:latest \
            .

          docker push $IMAGE:$SHA
          docker push $IMAGE:latest

      # ── 6. ECR 이미지 최대 3개 유지 ─────────────────────────────────────
      - name: Prune old ECR images (keep latest 3)
        run: |
          IMAGE_DETAILS=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPO }} \
            --region ${{ env.AWS_REGION }} \
            --query 'sort_by(imageDetails, &imagePushedAt)' \
            --output json)

          TOTAL=$(echo $IMAGE_DETAILS | jq length)
          DELETE_COUNT=$((TOTAL - 3))

          if [ $DELETE_COUNT -le 0 ]; then
            echo "이미지가 3개 이하입니다. 삭제 건너뜀."
            exit 0
          fi

          echo "전체 ${TOTAL}개 중 오래된 ${DELETE_COUNT}개 삭제"

          DIGESTS=$(echo $IMAGE_DETAILS | jq -r \
            ".[0:$DELETE_COUNT] | .[].imageDigest")

          for DIGEST in $DIGESTS; do
            aws ecr batch-delete-image \
              --repository-name ${{ env.ECR_REPO }} \
              --region ${{ env.AWS_REGION }} \
              --image-ids imageDigest=$DIGEST
            echo "삭제: $DIGEST"
          done

      # ── 7. 배포 (runner가 EC2 내부에서 직접 실행) ───────────────────────
      - name: Deploy
        run: |
          cd /home/ubuntu/matuabom

          docker compose pull fe
          docker compose up -d --no-deps --force-recreate fe

          echo "FE 헬스체크 시작..."
          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              http://localhost:3000 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "307" ] || [ "$HTTP_STATUS" = "308" ]; then
              echo "FE 배포 성공 (attempt $i, HTTP=$HTTP_STATUS)"
              break
            fi

            if [ $i -eq 12 ]; then
              echo "FE 헬스체크 실패 (HTTP=$HTTP_STATUS)"
              docker compose logs --tail=30 fe
              exit 1
            fi

            echo "대기 중... ($i/12, HTTP=$HTTP_STATUS)"
            sleep 5
          done

          docker image prune -f
