name: FE CI/CD

on:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

env:
  AWS_REGION:   ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ECR_REPO:     ${{ secrets.ECR_FE_REPO }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "api_base=https://matuabom.store" >> $GITHUB_OUTPUT
          else
            echo "api_base=https://dev.matuabom.store" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}
          SHA=${{ github.sha }}

          # main → :latest (프로덕션), develop → :dev-latest (개발)
          # 동일 :latest 태그 공유 시 develop 빌드가 프로덕션 이미지를 덮어쓰는 문제 방지
          if [ "${{ github.ref_name }}" = "main" ]; then
            FLOAT_TAG="latest"
          else
            FLOAT_TAG="dev-latest"
          fi

          docker build \
            --build-arg NEXT_PUBLIC_API_BASE=${{ steps.env.outputs.api_base }} \
            --no-cache \
            -t $IMAGE:$SHA \
            -t $IMAGE:$FLOAT_TAG \
            .

          docker push $IMAGE:$SHA
          docker push $IMAGE:$FLOAT_TAG

      - name: Prune old ECR images (keep latest 3)
        run: |
          IMAGE_DETAILS=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPO }} \
            --region ${{ env.AWS_REGION }} \
            --query 'sort_by(imageDetails, &imagePushedAt)' \
            --output json)

          TOTAL=$(echo $IMAGE_DETAILS | jq length)
          DELETE_COUNT=$((TOTAL - 3))

          if [ $DELETE_COUNT -le 0 ]; then
            echo "이미지 3개 이하, 삭제 건너뜀"
            exit 0
          fi

          DIGESTS=$(echo $IMAGE_DETAILS | jq -r ".[0:$DELETE_COUNT] | .[].imageDigest")
          for DIGEST in $DIGESTS; do
            aws ecr batch-delete-image \
              --repository-name ${{ env.ECR_REPO }} \
              --region ${{ env.AWS_REGION }} \
              --image-ids imageDigest=$DIGEST
          done

      - name: Get GitHub Actions IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Configure AWS Security Group Allow
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2
        if: github.ref_name == 'main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            cd /home/ubuntu/Deploy
            docker system prune -f
            docker compose pull fe
            docker compose up -d --no-deps --force-recreate fe

            echo "FE 헬스체크 시작..."
            for i in $(seq 1 12); do
              RUNNING=$(docker inspect --format='{{.State.Running}}' fe 2>/dev/null || echo "false")
              RESTARTING=$(docker inspect --format='{{.State.Restarting}}' fe 2>/dev/null || echo "true")

              if [ "$RUNNING" = "true" ] && [ "$RESTARTING" = "false" ]; then
                echo "FE 배포 성공 (attempt $i)"
                break
              fi

              if [ $i -eq 12 ]; then
                echo "FE 헬스체크 실패"
                docker compose -f /home/ubuntu/Deploy/docker-compose.yml logs --tail=30 fe
                exit 1
              fi

              echo "대기 중... ($i/12)"
              sleep 5
            done

            docker image prune -f

      - name: Configure AWS Security Group Revoke
        if: always() && steps.ip.outputs.ipv4 != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
