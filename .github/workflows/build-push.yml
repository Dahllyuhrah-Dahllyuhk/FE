name: FE CI/CD

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      branch:
        description: '배포할 브랜치 (main / develop)'
        required: false
        default: 'main'

env:
  AWS_REGION:     ${{ secrets.AWS_REGION }}
  ECR_REGISTRY:   ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ECR_REPO:       ${{ secrets.ECR_FE_REPO }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. 소스 체크아웃 ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Docker Buildx ─────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. AWS 자격증명 ──────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 4. ECR 로그인 ────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 5. 이미지 빌드 & 푸시 ───────────────────────────────────────────
      - name: Build and push image
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}
          SHA=${{ github.sha }}

          docker build \
            --build-arg NEXT_PUBLIC_API_BASE=https://matuabom.store \
            --no-cache \
            -t $IMAGE:$SHA \
            -t $IMAGE:latest \
            .

          docker push $IMAGE:$SHA
          docker push $IMAGE:latest

      # ── 6. ECR 이미지 최대 3개 유지 ─────────────────────────────────────
      - name: Prune old ECR images (keep latest 3)
        run: |
          IMAGE_DETAILS=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPO }} \
            --region ${{ env.AWS_REGION }} \
            --query 'sort_by(imageDetails, &imagePushedAt)' \
            --output json)

          TOTAL=$(echo $IMAGE_DETAILS | jq length)
          DELETE_COUNT=$((TOTAL - 3))

          if [ $DELETE_COUNT -le 0 ]; then
            echo "이미지가 3개 이하입니다. 삭제 건너뜀."
            exit 0
          fi

          echo "전체 ${TOTAL}개 중 오래된 ${DELETE_COUNT}개 삭제"

          DIGESTS=$(echo $IMAGE_DETAILS | jq -r \
            ".[0:$DELETE_COUNT] | .[].imageDigest")

          for DIGEST in $DIGESTS; do
            aws ecr batch-delete-image \
              --repository-name ${{ env.ECR_REPO }} \
              --region ${{ env.AWS_REGION }} \
              --image-ids imageDigest=$DIGEST
            echo "삭제: $DIGEST"
          done

      # ── 7. EC2 배포 ──────────────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_KEY }}
          script: |
            # ECR 로그인
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            cd /home/ubuntu/matuabom

            # 최신 이미지 pull
            docker compose pull fe

            # 무중단 재시작 (기존 컨테이너 유지 중 새 컨테이너 기동)
            docker compose up -d --no-deps --force-recreate fe

            # 헬스체크 (최대 60초 대기)
            echo "FE 헬스체크 시작..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' fe 2>/dev/null || echo "none")
              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "none" ]; then
                # healthcheck 미설정 시 컨테이너 실행 상태로만 확인
                RUNNING=$(docker inspect --format='{{.State.Running}}' fe 2>/dev/null || echo "false")
                if [ "$RUNNING" = "true" ]; then
                  echo "FE 배포 성공 (attempt $i)"
                  break
                fi
              fi
              if [ $i -eq 12 ]; then
                echo "FE 헬스체크 실패 — 롤백 시도"
                docker compose up -d --no-deps --force-recreate fe || true
                exit 1
              fi
              echo "대기 중... ($i/12)"
              sleep 5
            done

            # 댕글링 이미지 정리
            docker image prune -f
